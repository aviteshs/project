<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bulk Extension Fixer</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            min-height:100vh;
            background:
            radial-gradient(circle at top left,#312e81 0%,transparent 30%),
            radial-gradient(circle at bottom right,#0f766e 0%,transparent 30%),
            linear-gradient(135deg,#020617,#0f172a,#111827);
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            position:relative;
            color:white;
        }

        .glass-circle{
            position:absolute;
            width:350px;
            height:350px;
            border-radius:50%;
            filter:blur(120px);
            opacity:.5;
        }

        .circle1{
            background:#06b6d4;
            top:-120px;
            left:-120px;
        }

        .circle2{
            background:#8b5cf6;
            bottom:-120px;
            right:-120px;
        }

        .main-card{
            width:460px;
            padding:35px;
            border-radius:32px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.1);
            backdrop-filter:blur(24px);
            box-shadow:
            0 8px 32px rgba(0,0,0,.4),
            inset 0 1px 0 rgba(255,255,255,.05);
            position:relative;
            z-index:10;
            animation:fadeUp .8s ease;
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(25px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .top{
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-bottom:25px;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:12px;
        }

        .logo-icon{
            width:55px;
            height:55px;
            border-radius:18px;
            background:linear-gradient(135deg,#06b6d4,#8b5cf6);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:24px;
            box-shadow:0 10px 25px rgba(139,92,246,.4);
        }

        .logo h2{
            font-size:24px;
            font-weight:800;
        }

        .badge{
            padding:8px 14px;
            border-radius:50px;
            background:rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.08);
            font-size:12px;
            color:#cbd5e1;
        }

        .upload-box{
            margin-top:20px;
            border:2px dashed rgba(255,255,255,.15);
            border-radius:24px;
            padding:35px 20px;
            text-align:center;
            background:rgba(255,255,255,.03);
            transition:.3s;
            position:relative;
            overflow:hidden;
        }

        .upload-box:hover{
            transform:translateY(-2px);
            border-color:#8b5cf6;
            background:rgba(255,255,255,.05);
        }

        .upload-icon{
            font-size:55px;
            margin-bottom:12px;
        }

        .upload-title{
            font-size:18px;
            font-weight:700;
        }

        .upload-sub{
            margin-top:8px;
            font-size:13px;
            color:#94a3b8;
        }

        input[type=file]{
            position:absolute;
            width:100%;
            height:100%;
            left:0;
            top:0;
            opacity:0;
            cursor:pointer;
        }

        .field{
            margin-top:25px;
        }

        .field label{
            display:block;
            margin-bottom:10px;
            color:#cbd5e1;
            font-size:14px;
            font-weight:600;
        }

        .select-box{
            position:relative;
        }

        select{
            width:100%;
            padding:16px 18px;
            border-radius:18px;
            border:none;
            outline:none;
            background:rgba(255,255,255,.06);
            color:white;
            font-size:15px;
            appearance:none;
            border:1px solid rgba(255,255,255,.08);
            transition:.3s;
        }

        select:hover{
            border-color:#06b6d4;
        }

        select option{
            background:#0f172a;
        }

        .arrow{
            position:absolute;
            right:18px;
            top:50%;
            transform:translateY(-50%);
            pointer-events:none;
            font-size:14px;
            color:#cbd5e1;
        }

        .convert-btn{
            width:100%;
            margin-top:30px;
            padding:18px;
            border:none;
            border-radius:20px;
            background:linear-gradient(135deg,#06b6d4,#8b5cf6);
            color:white;
            font-size:16px;
            font-weight:700;
            cursor:pointer;
            transition:.3s;
            position:relative;
            overflow:hidden;
            box-shadow:0 12px 30px rgba(139,92,246,.35);
        }

        .convert-btn:hover{
            transform:translateY(-3px) scale(1.01);
            box-shadow:0 16px 40px rgba(139,92,246,.45);
        }

        .convert-btn::before{
            content:'';
            position:absolute;
            width:120px;
            height:200%;
            background:rgba(255,255,255,.15);
            transform:rotate(25deg);
            top:-50%;
            left:-130px;
            transition:.7s;
        }

        .convert-btn:hover::before{
            left:120%;
        }

        .success-card{
            margin-top:25px;
            padding:22px;
            border-radius:22px;
            background:rgba(16,185,129,.08);
            border:1px solid rgba(16,185,129,.2);
            text-align:center;
            animation:fadeUp .6s ease;
        }

        .success-card h3{
            font-size:18px;
            margin-bottom:10px;
        }

        .download-btn{
            display:inline-block;
            margin-top:10px;
            padding:14px 22px;
            border-radius:16px;
            text-decoration:none;
            color:white;
            font-weight:700;
            background:linear-gradient(135deg,#10b981,#06b6d4);
            transition:.3s;
        }

        .download-btn:hover{
            transform:scale(1.05);
        }

        .footer{
            margin-top:28px;
            text-align:center;
        }

        .footer a{
            text-decoration:none;
            color:#94a3b8;
            font-size:14px;
            transition:.3s;
        }

        .footer a:hover{
            color:white;
        }

        @media(max-width:520px){

            .main-card{
                width:92%;
                padding:24px;
            }

            .top{
                flex-direction:column;
                gap:15px;
                align-items:flex-start;
            }

        }

    </style>

</head>
<body>

<div class="glass-circle circle1"></div>
<div class="glass-circle circle2"></div>

<div class="main-card">

    <div class="top">

        <div class="logo">

            <div class="logo-icon">
                ⚡
            </div>

            <div>
                <h2>Bulk Extension Fixer</h2>
            </div>

        </div>

        <div class="badge">
            AI GUI v2.0
        </div>

    </div>

    <form method="post" enctype="multipart/form-data">

        <div class="upload-box">

            <div class="upload-icon">
                📂
            </div>

            <div class="upload-title">
                Drag & Drop Files
            </div>

            <div class="upload-sub">
                Upload multiple files instantly
            </div>

            <input type="file" name="files" multiple required>

        </div>

        <div class="field">

            <label>
                Convert Extension
            </label>

            <div class="select-box">

                <select name="ext" required>

                    <option value=".jpg">.jpg</option>
                    <option value=".png">.png</option>
                    <option value=".pdf">.pdf</option>
                    <option value=".txt">.txt</option>
                    <option value=".jpeg">.jpeg</option>
                    <option value=".webp">.webp</option>

                </select>

                <div class="arrow">
                    ▼
                </div>

            </div>

        </div>

        <button type="submit" class="convert-btn">
            ⚡ Convert Files Now
        </button>

    </form>

    {% if zip_file %}

    <div class="success-card">

        <h3>
            ✅ Files Converted Successfully
        </h3>

        <a href="/download/{{ zip_file }}" class="download-btn">
            Download ZIP
        </a>

    </div>

    {% endif %}

    <div class="footer">
        <a href="/">
            ⬅ Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
