<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Automation Dashboards</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
      color:white;
      overflow:hidden;
    }

    .bg{
      position:absolute;
      width:500px;
      height:500px;
      background:rgba(59,130,246,0.25);
      filter:blur(120px);
      border-radius:50%;
      top:-100px;
      left:-100px;
    }

    .bg2{
      position:absolute;
      width:400px;
      height:400px;
      background:rgba(168,85,247,0.25);
      filter:blur(120px);
      border-radius:50%;
      bottom:-100px;
      right:-100px;
    }

    .container{
      position:relative;
      z-index:10;
      width:420px;
      padding:40px;
      border-radius:24px;
      background:rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    h1{
      text-align:center;
      margin-bottom:10px;
      font-size:32px;
      font-weight:700;
      letter-spacing:1px;
    }

    p{
      text-align:center;
      margin-bottom:30px;
      color:#cbd5e1;
      font-size:14px;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .menu a{
      text-decoration:none;
      color:white;
      padding:16px 20px;
      border-radius:14px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      transition:0.3s ease;
      font-size:16px;
      font-weight:600;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .menu a:hover{
      transform:translateY(-4px) scale(1.02);
      background:linear-gradient(135deg,#2563eb,#7c3aed);
      box-shadow:0 10px 25px rgba(37,99,235,0.4);
    }

    .footer{
      margin-top:25px;
      text-align:center;
      font-size:12px;
      color:#94a3b8;
    }
  </style>
</head>

<body>

  <div class="bg"></div>
  <div class="bg2"></div>

  <div class="container">
    <h1>⚡ Automation Dashboard</h1>
    <p>Powerful tools in one place</p>

    <div class="menu">
      <a href="/bulk">
        Bulk Extension Fixer
        <span>→</span>
      </a>

      <a href="/rename">
        Bulk File Renamer
        <span>→</span>
      </a>

      <a href="/video">
        Video Downloader
        <span>→</span>
      </a>

      <a href="/share">
        File Sharing (2GB • 7 Days)
        <span>→</span>
      </a>
    </div>

    <div class="footer">
      Made with ❤️ by Avitesh
    </div>
  </div>

</body>
</html>
