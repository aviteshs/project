<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bulk File Renamer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(135deg,#0f172a,#111827,#1e293b);
    overflow:hidden;
    position:relative;
}

/* Animated Glow */
body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    background:#00f5ff;
    border-radius:50%;
    filter:blur(140px);
    top:-120px;
    left:-120px;
    opacity:.35;
}

body::after{
    content:'';
    position:absolute;
    width:450px;
    height:450px;
    background:#ff00e5;
    border-radius:50%;
    filter:blur(140px);
    bottom:-150px;
    right:-120px;
    opacity:.30;
}

.container{
    width:420px;
    padding:35px;
    border-radius:28px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:
    0 8px 32px rgba(0,0,0,0.4);
    color:white;
    position:relative;
    z-index:2;
}

.logo{
    width:75px;
    height:75px;
    border-radius:20px;
    margin:auto;
    margin-bottom:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    background:linear-gradient(135deg,#00f5ff,#ff00e5);
    box-shadow:0 0 25px rgba(255,255,255,0.25);
}

h2{
    text-align:center;
    font-size:28px;
    margin-bottom:30px;
    font-weight:600;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#d1d5db;
}

input[type="text"],
input[type="file"]{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:14px;
    background:rgba(255,255,255,0.08);
    color:white;
    margin-bottom:20px;
    border:1px solid rgba(255,255,255,0.1);
    transition:.3s;
}

input::placeholder{
    color:#9ca3af;
}

input:focus{
    border-color:#00f5ff;
    box-shadow:0 0 15px rgba(0,245,255,.3);
}

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:25px;
    font-size:15px;
}

.checkbox input{
    width:18px;
    height:18px;
    accent-color:#00f5ff;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:16px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#00f5ff,#ff00e5);
    transition:.3s;
    box-shadow:0 10px 25px rgba(255,0,229,0.3);
}

button:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:0 15px 30px rgba(0,245,255,0.35);
}

.download-box{
    margin-top:30px;
    padding:18px;
    border-radius:16px;
    background:rgba(255,255,255,0.08);
    text-align:center;
    border:1px solid rgba(255,255,255,0.08);
}

.download-box h3{
    margin-bottom:15px;
}

.download-btn{
    display:inline-block;
    padding:12px 20px;
    border-radius:12px;
    text-decoration:none;
    color:white;
    background:linear-gradient(135deg,#22c55e,#06b6d4);
    transition:.3s;
}

.download-btn:hover{
    transform:scale(1.05);
}

.back{
    margin-top:25px;
    text-align:center;
}

.back a{
    color:#cbd5e1;
    text-decoration:none;
    transition:.3s;
}

.back a:hover{
    color:#00f5ff;
}

.footer{
    text-align:center;
    margin-top:25px;
    font-size:12px;
    color:#94a3b8;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">⚡</div>

    <h2>Bulk File Renamer</h2>

    <form method="post" enctype="multipart/form-data">

        <label>Select Files</label>
        <input type="file" name="files" multiple required>

        <label>Prefix</label>
        <input type="text" name="prefix" placeholder="INV_">

        <label>Suffix</label>
        <input type="text" name="suffix" placeholder="_2026">

        <div class="checkbox">
            <input type="checkbox" name="numbering">
            <span>Enable Auto Numbering</span>
        </div>

        <button type="submit">🚀 Rename Files</button>

    </form>

    {% if zip_file %}
    <div class="download-box">
        <h3>✅ Files Ready</h3>
        <a class="download-btn" href="/download/{{ zip_file }}">
            ⬇ Download ZIP
        </a>
    </div>
    {% endif %}

    <div class="back">
        <a href="/">⬅ Back to Dashboard</a>
    </div>

    <div class="footer">
        Made with ❤️ by Avitesh
    </div>

</div>

</body>
</html>
