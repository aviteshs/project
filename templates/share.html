<!DOCTYPE html>
<html>
<head>
    <title>Large File Sharing</title>
</head>
<body>

<h2>File Sharing (Up to 2GB)</h2>

<form method="post" enctype="multipart/form-data">
    <input type="file" name="files" multiple required>
    <br><br>
    <button type="submit">Upload & Generate Link</button>
</form>

{% if link %}
<hr>

<p><b>Download link (expires in 7 days):</b></p>
<input type="text" value="{{ link }}" style="width: 420px;" readonly>

<p style="color:red;">This link will expire on {{ expiry }}</p>

<br>

<a href="https://wa.me/?text={{ link }}" target="_blank">
    Share on WhatsApp
</a>

<br><br>

<a href="mailto:?subject=File Download Link&body=Download here: {{ link }}">
    Share via Email
</a>
{% endif %}

<br><br>
<a href="/">Back to Dashboard</a>

</body>
</html>
