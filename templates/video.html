<!DOCTYPE html>
<html>
<head>
    <title>Video Downloader</title>
</head>
<body>

<h2>Universal Video Downloader</h2>

<form method="post">
    <label>Paste Video Link:</label><br><br>
    <input type="text" name="url" style="width: 400px;" required>
    <br><br>
    <button type="submit">Download</button>
</form>

{% if file %}
<hr>
<h3>Download Video</h3>
<a href="/download-video/{{ file }}">Click here to download</a>
{% endif %}

<br><br>
<a href="/">⬅ Back to Dashboard</a>

</body>
</html>
